name: 🐛 バグ報告
description: バグや不具合の報告
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        Enhandiyに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
        投稿前に[README](https://github.com/roflsunriz/Enhandiy/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/Enhandiy/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/Enhandiy/blob/main/SECURITY.md)の案内に従ってください。
  - type: markdown
    attributes:
      value: |-
        バグを報告していただき、ありがとうございます。
        以下の情報を提供していただくことで、問題の解決を迅速に行うことができます。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: textarea
    id: bug-description
    attributes:
      label: 概要
      description: 発生している問題について詳しく説明してください
      placeholder: 何が起こったか、何を期待していたかを記載してください
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      description: 使用しているEnhandiyのバージョン
      placeholder: v4.3.7
    validations:
      required: true
  - type: dropdown
    id: php-version
    attributes:
      label: PHP バージョン
      description: 使用しているPHPのバージョン
      options:
        - PHP 8.1
        - PHP 8.2
        - PHP 8.3
        - その他
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 実行環境
      description: アプリケーションを実行している環境
      options:
        - Apache
        - Nginx
        - Docker
        - その他
    validations:
      required: true
  - type: textarea
    id: browser-info
    attributes:
      label: ブラウザ情報
      description: 使用しているブラウザとバージョン（フロントエンドの問題の場合）
      placeholder: Chrome 139.0.7258.155, Firefox 142.0.1, Safari 18.6 など
  - type: textarea
    id: reproduction-steps
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記載してください
      placeholder: |-
        1. '...'にアクセス
        2. '...'をクリック
        3. '...'を入力
        4. エラーが発生
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待した結果
      description: 本来どのような動作をするべきかを記載してください
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: 実際の結果
      description: 実際に起こった動作を記載してください
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: 診断情報
      description: 関連するエラーログがあれば貼り付けてください
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: その他、問題の解決に役立つ情報があれば記載してください
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
