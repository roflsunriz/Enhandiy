name: ✨ 機能要求
description: 新しい機能や改善の提案
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |-
        Enhandiyに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
        投稿前に[README](https://github.com/roflsunriz/Enhandiy/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/Enhandiy/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/Enhandiy/blob/main/SECURITY.md)の案内に従ってください。
  - type: markdown
    attributes:
      value: |-
        新しい機能や改善のご提案をありがとうございます。
        詳細な情報を提供していただくことで、より良い機能を実装することができます。
  - type: textarea
    id: feature-description
    attributes:
      label: 提案の概要
      description: 提案する機能について詳しく説明してください
      placeholder: どのような機能を求めているかを記載してください
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 解決したい問題
      description: なぜこの機能が必要なのか、どのような問題を解決するのかを説明してください
      placeholder: 現在の問題点や、この機能があることでどう改善されるかを記載してください
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 提案する変更
      description: どのように実装すれば良いか、アイデアがあれば記載してください
      placeholder: 具体的な実装方法やUIの提案があれば記載してください
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案と互換性
      description: 他に考えられる解決方法があれば記載してください
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: この機能の重要度をお選びください
      options:
        - 高（緊急に必要）
        - 中（あると便利）
        - 低（将来的にあれば良い）
    validations:
      required: true
  - type: checkboxes
    id: feature-type
    attributes:
      label: 機能の種類
      description: 該当するものをすべて選択してください
      options:
        - label: UI/UX改善
        - label: セキュリティ機能
        - label: パフォーマンス改善
        - label: 管理機能
        - label: API機能
        - label: 設定オプション
        - label: ドキュメント改善
  - type: textarea
    id: mockups
    attributes:
      label: モックアップ・スクリーンショット
      description: UIの変更を伴う場合、モックアップや参考画像があれば添付してください
  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: その他、この機能に関する情報があれば記載してください
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
