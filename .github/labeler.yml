# 設定ファイル関連
"area/config":
  - changed-files:
    - any-glob-to-any-file: ['backend/config/**/*', 'config.php.example']

# API関連
"area/api":
  - changed-files:
    - any-glob-to-any-file: ['backend/api/**/*']

# UI/フロントエンド関連
"area/frontend":
  - changed-files:
    - any-glob-to-any-file: ['backend/views/**/*', 'frontend/src/**/*', 'frontend/asset/**/*']

# データベース関連
"area/database":
  - changed-files:
    - any-glob-to-any-file: ['backend/models/**/*', 'db/**/*']

# Docker関連
"area/docker":
  - changed-files:
    - any-glob-to-any-file: ['infrastructure/docker/**/*', 'infrastructure/docker-compose.yaml', 'infrastructure/Dockerfile']

# ドキュメント関連
"area/documentation":
  - changed-files:
    - any-glob-to-any-file: ['*.md', 'docs/**/*']

# CI/CD関連
"area/ci":
  - changed-files:
    - any-glob-to-any-file: ['.github/**/*']

# セキュリティ関連
"area/security":
  - changed-files:
    - any-glob-to-any-file: ['backend/config/**/*', 'backend/api/verify*']

# リリース関連
"area/release":
  - changed-files:
    - any-glob-to-any-file: ['infrastructure/scripts/release.*', 'composer.json', 'CHANGELOG.md']
