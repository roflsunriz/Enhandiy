name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Display PHP version info
        run: |
          echo "🐘 Testing PHP ${{ matrix.php-version }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 #v2.35.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite, sqlite3
          tools: composer
          coverage: none
          ini-values: error_reporting=E_ALL&~E_DEPRECATED&~E_STRICT

      - name: Validate composer.json
        run: |
          echo "🔍 Validating composer.json..."

          # まず基本的なJSONの妥当性をチェック
          if ! php -r "json_decode(file_get_contents('composer.json'), true); if (json_last_error() !== JSON_ERROR_NONE) exit(1);"; then
            echo "❌ composer.json contains invalid JSON"
            exit 1
          fi

          # Composer validation実行
          composer validate --no-check-publish || {
            echo "❌ composer.json validation failed"
            echo "🔍 詳細な診断情報:"
            composer validate --verbose
            echo "📋 composer.json の内容確認:"
            cat composer.json
            exit 1
          }
          echo "✅ composer.json validation passed"

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: |
          echo "📦 Installing Composer dependencies..."
          composer install --prefer-dist --no-progress --no-interaction
          echo "✅ Dependencies installed successfully"

      - name: Check PHP syntax
        run: |
          echo "🔍 PHP構文チェックを実行中..."
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "✅ PHP構文チェック完了"

      - name: Run PHP CodeSniffer
        run: composer lint

      - name: Run PHPStan
        run: composer analyse

      - name: Test configuration file creation
        run: |
          # 必要なディレクトリを作成
          mkdir -p data db config
          # config.php.exampleからconfig.phpを作成
          if [ ! -f backend/config/config.php ]; then
            cp backend/config/config.php.example backend/config/config.php
            echo "✅ config.php.exampleからconfig.phpを作成しました"
          fi
          # 設定ファイルの構文チェック
          php -l backend/config/config.php

      - name: Run application tests
        run: composer test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Docker build
        run: docker build -t enhandiy-test ./infrastructure/docker/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup PHP for isolated regressions
        uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.35.2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Isolated comment and replacement regressions
        run: npm run test:isolated
      - name: Security audit
        run: npm audit

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 #v2.35.2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_sqlite
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Security audit
        run: |
          # Composerセキュリティ監査
          composer audit

      - name: Check for sensitive files
        run: |
          # 機密ファイルがコミットされていないかチェック
          if [ -f "backend/config/config.php" ]; then
            echo "Error: config.php should not be committed"
            exit 1
          fi

          # .envファイルのチェック
          if [ -f ".env" ]; then
            echo "Error: .env should not be committed"
            exit 1
          fi

          echo "✅ No sensitive files found"

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint README
        run: markdownlint README.md CHANGELOG.md --ignore node_modules --config .markdownlint.json

      - name: Check links in README
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 #v1.10.17
        with:
          use-quiet-mode: 'yes'
